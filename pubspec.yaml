name: javix_cinema
description: Javix Cinema - cinematic movie discovery app.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/javix_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/javix_logo.png"
  min_sdk_android: 21
