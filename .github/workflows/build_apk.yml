name: Build Javix Cinema APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.javix --project-name javix_cinema

      - name: Allow local HTTP API
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  '<manifest ',
                  '<manifest ',
                  1
              )
              marker = '>'
              pos = text.find(marker)
              text = text[:pos + 1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + text[pos + 1:]

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android HTTP API access enabled")
          PY

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: javix-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
